<title>📊 경제 브리핑 — 시장 지표와 재테크 인사이트</title>
<style>
body{font-family:sans-serif;max-width:800px;margin:auto;padding:20px;line-height:1.6;color:#333}
h1{color:#1a1a2e;border-bottom:3px solid #1565c0;padding-bottom:10px}
.post-list{list-style:none;padding:0}
.post-list li{margin:12px 0;padding:12px;background:#f9f9f9;border-radius:8px;border-left:4px solid #1565c0}
.post-list a{text-decoration:none;color:#1a1a2e;font-weight:bold}
.post-list a:hover{color:#1565c0}
.date{color:#999;font-size:0.85em}
</style>
</head>
<body>
<h1>📊 경제 브리핑 — 시장 지표와 재테크 인사이트</h1>
<p>매일 아침 시장 지표와 경제 뉴스를 쉽게 정리해 드립니다. 초보자도 이해하는 경제 해설.</p>
<hr>
<ul class="post-list" id="postList">
<li>포스트를 불러오는 중...</li>
</ul>
<script>
fetch('/posts.json').then(r=>r.json()).then(posts=>{
  const ul=document.getElementById('postList'); ul.innerHTML='';
  posts.forEach(p=>{
    const li=document.createElement('li');
    li.innerHTML=`<a href="/posts/${p.slug}.html">${p.title}</a> <span class="date">${p.date}</span>`;
    ul.appendChild(li);
  })
})
</script>
<hr>
<p style="color:#999;font-size:0.85em;">* 본 블로그는 정보 제공 목적이며, 투자 결정은 본인의 판단과 전문가 상담을 거쳐야 합니다.</p>
</body>
