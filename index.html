<meta name="robots" content="index, follow">
<title>가성비 Pick! — 쿠팡 제휴 리뷰 블로그</title>
<style>
body{font-family:sans-serif;max-width:800px;margin:auto;padding:20px;line-height:1.6;color:#333}
h1{color:#1a1a2e;border-bottom:3px solid #ff6b35;padding-bottom:10px}
.post-list{list-style:none;padding:0}
.post-list li{margin:12px 0;padding:12px;background:#f9f9f9;border-radius:8px;border-left:4px solid #ff6b35}
.post-list a{text-decoration:none;color:#1a1a2e;font-weight:bold}
.post-list a:hover{color:#ff6b35}
.date{color:#999;font-size:0.85em}
</style>
</head>
<body>
<h1>🔥 가성비 Pick! — 쿠팡 제휴 리뷰</h1>
<p>실제 상품 데이터를 기반으로 한 비교 분석. 최저가 확인은 링크를 클릭하세요.</p>
<hr>
<ul class="post-list" id="postList">
<li>포스트를 불러오는 중...</li>
</ul>
<script>
fetch('/posts.json').then(r=>r.json()).then(posts=>{
  const ul=document.getElementById('postList'); ul.innerHTML='';
  posts.forEach(p=>{
    const li=document.createElement('li');
    li.innerHTML=`<a href="/posts/${p.slug}.html">${p.title}</a> <span class="date">${p.date}</span>`;
    ul.appendChild(li);
  })
})
</script>
<hr>
<p style="color:#999;font-size:0.85em;">* 본 블로그는 쿠팡 파트너스 활동의 일환으로 수수료를 제공받을 수 있습니다.</p>
</body>
